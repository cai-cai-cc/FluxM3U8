# ── JVM 内存 ──
# 本机 16 GB 物理内存、页面文件接近 0（系统提交上限约 16 GB），
# 多个 JVM 同时按 2 GB 上限启动时会报：
#   os::commit_memory(...) failed ... error='页面文件太小' (DOS error/errno=1455)
# 表现为 IDE 同步报 "Unable to start the daemon process"、构建中途 daemon 消失。
# Gradle 主进程保留 2 GB（配置/打包阶段更快）；Kotlin 编译 daemon 降到 1536m，
# 降低“两个 2 GB JVM 同时申请”的概率。内存宽裕后可把两者都调回 2048m。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# dex/R8 阶段的并行 worker 上限（默认 = CPU 核数）。
# 4 是速度与提交内存峰值的折中；若再遇到 daemon 崩溃就降到 2。
org.gradle.workers.max=4

# ── AndroidX ──
android.useAndroidX=true

# Kotlin 代码风格
kotlin.code.style=official

# 非传递 R 类（AGP 8 已默认开启，显式写出便于理解）
android.nonTransitiveRClass=true

# ── 构建加速 ──
# 配置缓存：二次构建跳过整个配置阶段，是这里收益最大的一项（Gradle 8 稳定特性）
org.gradle.configuration-cache=true

# 构建缓存：复用历史产物，增量构建、切分支时收益明显
org.gradle.caching=true

# Gradle 守护进程（默认即为 true，显式写出以免误解）
org.gradle.daemon=true

# 注意：org.gradle.parallel 是“跨模块并行”，本工程只有 :app 一个模块，
# 开了也不会更快，所以不再设置；将来拆出多模块时再加。
